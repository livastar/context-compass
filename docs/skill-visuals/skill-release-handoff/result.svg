<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Skill Release Handoff: the result you should get</title>
<desc id="d">The result contains: Artifact identity (The exact ZIP SHA-256); Source audit (Its own verdict); Archive audit (Its own verdict); Parity (Differing or missing files, if any); Runtime (Declared prerequisites met or unmet); Next action (Owner and what to do next). It does not: PASS does not prove task behavior; Not a security, install or deployment check; No marketplace acceptance; Changed inputs need a new run and evidence directory.</desc>
<style>@media (prefers-reduced-motion: reduce){*{animation:none !important}}</style>
