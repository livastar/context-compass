<path class="dash" d="M360 254 C410 254 400 254 450 254" fill="none" stroke="#64748b" stroke-width="2"/><rect x="60" y="234" width="300" height="40" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><text x="76" y="259" font-size="14.5" fill="#f8fafc"><tspan x="76" dy="0">The exact ZIP</tspan></text>
