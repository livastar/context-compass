<rect x="450" y="196" width="300" height="116" rx="20" fill="#22c55e"/><text x="600" y="246" font-size="24" fill="#0f172a" font-weight="800" text-anchor="middle"><tspan x="600" dy="0">Skill Release</tspan><tspan x="600" dy="32">Handoff</tspan></text>
<text x="60" y="366" font-size="12" fill="#94a3b8" font-weight="700" letter-spacing="1.5"><tspan x="60" dy="0">HOW IT ACTS</tspan></text>
<rect x="60" y="380" width="166.66666666666666" height="140" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><circle cx="84" cy="404" r="12" fill="#22c55e"/><text x="84" y="409" font-size="13" fill="#0f172a" font-weight="800" text-anchor="middle"><tspan x="84" dy="0">1</tspan></text><text x="104" y="409" font-size="14.5" fill="#f8fafc" font-weight="700"><tspan x="104" dy="0">Prepare</tspan></text><text x="74" y="452" font-size="12.5" fill="#cbd5e1"><tspan x="74" dy="0">Folder, ZIP,</tspan><tspan x="74" dy="17">contract,</tspan><tspan x="74" dy="17">prerequisites,</tspan><tspan x="74" dy="17">evidence directory.</tspan></text><rect x="60" y="380" width="166.66666666666666" height="140" rx="12" fill="none" stroke="#86efac" stroke-width="1.5" class="hl" style="stroke-width:3;animation-delay:0.0s"/>
<path d="M229.66666666666666 450h10" fill="none" stroke="#64748b" stroke-width="2"/><rect x="242.66666666666666" y="380" width="166.66666666666666" height="140" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><circle cx="266.66666666666663" cy="404" r="12" fill="#22c55e"/><text x="266.66666666666663" y="409" font-size="13" fill="#0f172a" font-weight="800" text-anchor="middle"><tspan x="266.66666666666663" dy="0">2</tspan></text><text x="286.66666666666663" y="409" font-size="14.5" fill="#f8fafc" font-weight="700"><tspan x="286.66666666666663" dy="0">Audit both</tspan></text><text x="256.66666666666663" y="452" font-size="12.5" fill="#cbd5e1"><tspan x="256.66666666666663" dy="0">Source and archive,</tspan><tspan x="256.66666666666663" dy="17">each read as data.</tspan></text><rect x="242.66666666666666" y="380" width="166.66666666666666" height="140" rx="12" fill="none" stroke="#86efac" stroke-width="1.5" class="hl" style="stroke-width:3;animation-delay:1.6s"/>
<path d="M412.3333333333333 450h10" fill="none" stroke="#64748b" stroke-width="2"/><rect x="425.3333333333333" y="380" width="166.66666666666666" height="140" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><circle cx="449.3333333333333" cy="404" r="12" fill="#22c55e"/><text x="449.3333333333333" y="409" font-size="13" fill="#0f172a" font-weight="800" text-anchor="middle"><tspan x="449.3333333333333" dy="0">3</tspan></text><text x="469.3333333333333" y="409" font-size="14.5" fill="#f8fafc" font-weight="700"><tspan x="469.3333333333333" dy="0">Compare</tspan></text><text x="439.3333333333333" y="452" font-size="12.5" fill="#cbd5e1"><tspan x="439.3333333333333" dy="0">Folder against ZIP,</tspan><tspan x="439.3333333333333" dy="17">file by file.</tspan></text><rect x="425.3333333333333" y="380" width="166.66666666666666" height="140" rx="12" fill="none" stroke="#86efac" stroke-width="1.5" class="hl" style="stroke-width:3;animation-delay:3.2s"/>
<path d="M595 450h10" fill="none" stroke="#64748b" stroke-width="2"/><path d="M508.66666666666663 520v20" fill="none" stroke="#fbbf24" stroke-width="2"/><rect x="425.3333333333333" y="540" width="166.66666666666666" height="58" rx="10" fill="#451a03" stroke="#fbbf24" stroke-width="1.5"/><text x="437.3333333333333" y="560" font-size="12" fill="#fde68a" font-weight="600"><tspan x="437.3333333333333" dy="0">Differs or missing?</tspan><tspan x="437.3333333333333" dy="16">REVISE. Name the</tspan><tspan x="437.3333333333333" dy="16">owner.</tspan></text>
<rect x="608" y="380" width="166.66666666666666" height="140" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><circle cx="632" cy="404" r="12" fill="#22c55e"/><text x="632" y="409" font-size="13" fill="#0f172a" font-weight="800" text-anchor="middle"><tspan x="632" dy="0">4</tspan></text><text x="652" y="409" font-size="14.5" fill="#f8fafc" font-weight="700"><tspan x="652" dy="0">Check</tspan><tspan x="652" dy="19">prerequisites</tspan></text><text x="622" y="452" font-size="12.5" fill="#cbd5e1"><tspan x="622" dy="0">Only declared,</tspan><tspan x="622" dy="17">fixed version</tspan><tspan x="622" dy="17">probes.</tspan></text><rect x="608" y="380" width="166.66666666666666" height="140" rx="12" fill="none" stroke="#86efac" stroke-width="1.5" class="hl" style="stroke-width:3;animation-delay:4.8s"/>
<path d="M777.6666666666666 450h10" fill="none" stroke="#64748b" stroke-width="2"/><path d="M691.3333333333334 520v20" fill="none" stroke="#fbbf24" stroke-width="2"/><rect x="608" y="540" width="166.66666666666666" height="58" rx="10" fill="#451a03" stroke="#fbbf24" stroke-width="1.5"/><text x="620" y="560" font-size="12" fill="#fde68a" font-weight="600"><tspan x="620" dy="0">Unsupported or</tspan><tspan x="620" dy="16">incomplete? HOLD.</tspan></text>
<rect x="790.6666666666666" y="380" width="166.66666666666666" height="140" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><circle cx="814.6666666666666" cy="404" r="12" fill="#22c55e"/><text x="814.6666666666666" y="409" font-size="13" fill="#0f172a" font-weight="800" text-anchor="middle"><tspan x="814.6666666666666" dy="0">5</tspan></text><text x="834.6666666666666" y="409" font-size="14.5" fill="#f8fafc" font-weight="700"><tspan x="834.6666666666666" dy="0">Decide</tspan></text><text x="804.6666666666666" y="452" font-size="12.5" fill="#cbd5e1"><tspan x="804.6666666666666" dy="0">Four separate</tspan><tspan x="804.6666666666666" dy="17">verdicts, never</tspan><tspan x="804.6666666666666" dy="17">merged.</tspan></text><rect x="790.6666666666666" y="380" width="166.66666666666666" height="140" rx="12" fill="none" stroke="#86efac" stroke-width="1.5" class="hl" style="stroke-width:3;animation-delay:6.4s"/>
<path d="M960.3333333333333 450h10" fill="none" stroke="#64748b" stroke-width="2"/><path d="M874 520v20" fill="none" stroke="#22c55e" stroke-width="2"/><rect x="790.6666666666666" y="540" width="166.66666666666666" height="58" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/><text x="802.6666666666666" y="560" font-size="12" fill="#bbf7d0" font-weight="600"><tspan x="802.6666666666666" dy="0">PASS: hand over the</tspan><tspan x="802.6666666666666" dy="16">exact ZIP SHA-256.</tspan></text>
<rect x="973.3333333333333" y="380" width="166.66666666666666" height="140" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><circle cx="997.3333333333333" cy="404" r="12" fill="#22c55e"/><text x="997.3333333333333" y="409" font-size="13" fill="#0f172a" font-weight="800" text-anchor="middle"><tspan x="997.3333333333333" dy="0">6</tspan></text><text x="1017.3333333333333" y="409" font-size="14.5" fill="#f8fafc" font-weight="700"><tspan x="1017.3333333333333" dy="0">Recipient</tspan><tspan x="1017.3333333333333" dy="19">accepts</tspan></text><text x="987.3333333333333" y="452" font-size="12.5" fill="#cbd5e1"><tspan x="987.3333333333333" dy="0">First task result</tspan><tspan x="987.3333333333333" dy="17">tied to that ZIP.</tspan></text><rect x="973.3333333333333" y="380" width="166.66666666666666" height="140" rx="12" fill="none" stroke="#86efac" stroke-width="1.5" class="hl" style="stroke-width:3;animation-delay:8.0s"/>
<text x="60" y="644" font-size="12" fill="#94a3b8" font-weight="700" letter-spacing="1.5"><tspan x="60" dy="0">RESULT STATES</tspan></text><rect x="60" y="658" width="61" height="30" rx="15" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/><text x="90.5" y="678" font-size="13" fill="#bbf7d0" font-weight="700" text-anchor="middle"><tspan x="90.5" dy="0">PASS</tspan></text><rect x="131" y="658" width="77" height="30" rx="15" fill="#451a03" stroke="#fbbf24" stroke-width="1.5"/><text x="169.5" y="678" font-size="13" fill="#fde68a" font-weight="700" text-anchor="middle"><tspan x="169.5" dy="0">REVISE</tspan></text><rect x="218" y="658" width="61" height="30" rx="15" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/><text x="248.5" y="678" font-size="13" fill="#cbd5e1" font-weight="700" text-anchor="middle"><tspan x="248.5" dy="0">HOLD</tspan></text><text x="1140" y="678" font-size="12.5" fill="#94a3b8" text-anchor="end"><tspan x="1140" dy="0">Amber: the skill stops or flags. Green: the result you want.</tspan></text>
