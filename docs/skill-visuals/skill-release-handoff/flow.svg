<path class="dash" d="M750 254 C800 254 790 254 840 254" fill="none" stroke="#22c55e" stroke-width="2"/><rect x="840" y="234" width="300" height="40" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/><text x="856" y="259" font-size="14.5" fill="#f8fafc"><tspan x="856" dy="0">The ZIP SHA-256 identity</tspan></text>
