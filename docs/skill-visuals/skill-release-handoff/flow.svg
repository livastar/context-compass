<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Skill Release Handoff: what it does and how it acts</title>
<desc id="d">Inputs: The release folder; The exact ZIP; Release contract and prerequisite list. Steps: Prepare, Audit both, Compare, Check prerequisites, Decide, Recipient accepts. Outputs: report.md and report.json; The ZIP SHA-256 identity; Next action, with owner.</desc>
<style>.dash{stroke-dasharray:6 8;animation:dash 1.2s linear infinite}@keyframes dash{to{stroke-dashoffset:-14}}.hl{opacity:0;animation:hl 9.600000000000001s linear infinite}@keyframes hl{0%{opacity:0}3%{opacity:1}15.67%{opacity:1}19.67%{opacity:0}100%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none !important}}</style>
