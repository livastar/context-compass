<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Skill Release Handoff: one sample run</title>
<desc id="d">Sample run from an illustrative case, not a recorded run. Inputs fixed. Evidence directory sits outside the folder. Source audit and archive audit each report. Parity: one file differs between folder and ZIP. REVISE: owner rebuilds the ZIP. New ZIP, new evidence directory. Prerequisites met. PASS: ZIP SHA-256 handed to the recipient. Outcome: REVISE, then PASS on the rebuilt ZIP.</desc>
<style>.l0{animation:l0 13.5s linear infinite}@keyframes l0{0%,4.44%{opacity:0}7.44%,97%{opacity:1}100%{opacity:0}}.l1{animation:l1 13.5s linear infinite}@keyframes l1{0%,15.56%{opacity:0}18.56%,97%{opacity:1}100%{opacity:0}}.l2{animation:l2 13.5s linear infinite}@keyframes l2{0%,26.67%{opacity:0}29.67%,97%{opacity:1}100%{opacity:0}}.l3{animation:l3 13.5s linear infinite}@keyframes l3{0%,37.78%{opacity:0}40.78%,97%{opacity:1}100%{opacity:0}}.l4{animation:l4 13.5s linear infinite}@keyframes l4{0%,48.89%{opacity:0}51.89%,97%{opacity:1}100%{opacity:0}}.l5{animation:l5 13.5s linear infinite}@keyframes l5{0%,60.00%{opacity:0}63.00%,97%{opacity:1}100%{opacity:0}}.v{animation:v 13.5s linear infinite}@keyframes v{0%,71.11%{opacity:0}74.11%,97%{opacity:1}100%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none !important}}</style>
<rect x="0" y="0" width="1200" height="580" rx="28" fill="#0f172a"/>
<text x="60" y="58" font-size="13" fill="#86efac" font-weight="700" letter-spacing="1.5"><tspan x="60" dy="0">ONE RUN</tspan></text><text x="60" y="96" font-size="28" fill="#f8fafc" font-weight="700"><tspan x="60" dy="0">Skill Release Handoff: a repaired folder shipped in an old ZIP</tspan></text><text x="60" y="126" font-size="15" fill="#94a3b8"><tspan x="60" dy="0">Source: an illustrative case, not a recorded run. It shows how the skill acts. It is not a customer result.</tspan></text>
<rect x="60" y="152" width="1080" height="324" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
<g class="l0"><circle cx="92" cy="189" r="13" fill="#22c55e"/><text x="92" y="194" font-size="13" fill="#0f172a" font-weight="800" text-anchor="middle"><tspan x="92" dy="0">1</tspan></text><text x="118" y="194" font-size="14" fill="#86efac" font-weight="700"><tspan x="118" dy="0">Prepare</tspan></text><text x="330" y="194" font-size="15" fill="#f8fafc"><tspan x="330" dy="0">Inputs fixed. Evidence directory sits outside the folder</tspan></text></g>
<g class="l1"><circle cx="92" cy="239" r="13" fill="#22c55e"/><text x="92" y="244" font-size="13" fill="#0f172a" font-weight="800" text-anchor="middle"><tspan x="92" dy="0">2</tspan></text><text x="118" y="244" font-size="14" fill="#86efac" font-weight="700"><tspan x="118" dy="0">Audit both</tspan></text><text x="330" y="244" font-size="15" fill="#f8fafc"><tspan x="330" dy="0">Source audit and archive audit each report</tspan></text></g>
<g class="l2"><circle cx="92" cy="289" r="13" fill="#22c55e"/><text x="92" y="294" font-size="13" fill="#0f172a" font-weight="800" text-anchor="middle"><tspan x="92" dy="0">3</tspan></text><text x="118" y="294" font-size="14" fill="#86efac" font-weight="700"><tspan x="118" dy="0">Compare</tspan></text><text x="330" y="294" font-size="15" fill="#f8fafc"><tspan x="330" dy="0">Parity: one file differs between folder and ZIP</tspan></text></g>
<g class="l3"><circle cx="92" cy="339" r="13" fill="#22c55e"/><text x="92" y="344" font-size="13" fill="#0f172a" font-weight="800" text-anchor="middle"><tspan x="92" dy="0">5</tspan></text><text x="118" y="344" font-size="14" fill="#86efac" font-weight="700"><tspan x="118" dy="0">Decide</tspan></text><text x="330" y="344" font-size="15" fill="#f8fafc"><tspan x="330" dy="0">REVISE: owner rebuilds the ZIP</tspan></text></g>
<g class="l4"><circle cx="92" cy="389" r="13" fill="#22c55e"/><text x="92" y="394" font-size="13" fill="#0f172a" font-weight="800" text-anchor="middle"><tspan x="92" dy="0">4</tspan></text><text x="118" y="394" font-size="14" fill="#86efac" font-weight="700"><tspan x="118" dy="0">Check prerequisites</tspan></text><text x="330" y="394" font-size="15" fill="#f8fafc"><tspan x="330" dy="0">New ZIP, new evidence directory. Prerequisites met</tspan></text></g>
<g class="l5"><circle cx="92" cy="439" r="13" fill="#22c55e"/><text x="92" y="444" font-size="13" fill="#0f172a" font-weight="800" text-anchor="middle"><tspan x="92" dy="0">5</tspan></text><text x="118" y="444" font-size="14" fill="#86efac" font-weight="700"><tspan x="118" dy="0">Decide</tspan></text><text x="330" y="444" font-size="15" fill="#f8fafc"><tspan x="330" dy="0">PASS: ZIP SHA-256 handed to the recipient</tspan></text></g>
<g class="v"><text x="60" y="532" font-size="12" fill="#94a3b8" font-weight="700" letter-spacing="1.5"><tspan x="60" dy="0">OUTCOME</tspan></text><rect x="150" y="510" width="350" height="34" rx="17" fill="#22c55e"/><text x="325" y="532" font-size="14.5" fill="#0f172a" font-weight="800" text-anchor="middle"><tspan x="325" dy="0">REVISE, then PASS on the rebuilt ZIP</tspan></text></g>
</svg>
