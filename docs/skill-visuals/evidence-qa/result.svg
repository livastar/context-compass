<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Evidence QA v1: the result you should get</title>
<desc id="d">The result contains: Rubric version (Which criteria were applied); Evaluated speaker (The exact label you chose); Artifacts (Report, draft rows, saved assessments); Score and coverage (Per criterion, with checked excerpts); Review-required criteria (What a person still has to check); Verification state (Offline, buyer-account, or blocked). It does not: Drafts, not final decisions; A found quote does not prove the label; No employment decisions; An offline pass does not prove live provider access.</desc>
<style>@media (prefers-reduced-motion: reduce){*{animation:none !important}}</style>
