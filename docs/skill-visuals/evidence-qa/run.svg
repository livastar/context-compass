<title id="t">Evidence QA v1: one sample run</title>
<desc id="d">Sample run from the bundled synthetic demo. node scripts/cli.mjs demo, then the kit checks. Rubric validated. Speaker label set explicitly. No provider credentials needed offline. Each criterion assessed. Quotes matched to the transcript. Synthetic report and draft rows written. Review flags listed for a person to check. Outcome: Offline-verified · live access not shown yet.</desc>
