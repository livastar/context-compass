<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Quality Department: what it does and how it acts</title>
<desc id="d">Inputs: Ticket, spec or acceptance criteria; The change: branch or PR; Tests and repository rules. Steps: Find what &quot;done&quot; means, Find the evidence, Read the assertion, Run it yourself, Answer. Outputs: Ready / Not ready / Cannot say yet; Trace table per criterion; Next action per gap, with owner.</desc>
<style>.dash{stroke-dasharray:6 8;animation:dash 1.2s linear infinite}@keyframes dash{to{stroke-dashoffset:-14}}.hl{opacity:0;animation:hl 8s linear infinite}@keyframes hl{0%{opacity:0}3%{opacity:1}19.00%{opacity:1}23.00%{opacity:0}100%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none !important}}</style>
<rect x="0" y="0" width="1200" height="720" rx="28" fill="#0f172a"/>
<text x="60" y="58" font-size="13" fill="#86efac" font-weight="700" letter-spacing="1.5"><tspan x="60" dy="0">PAID SKILL · $69</tspan></text>
<text x="60" y="96" font-size="32" fill="#f8fafc" font-weight="700"><tspan x="60" dy="0">Quality Department</tspan></text>
<text x="60" y="126" font-size="17" fill="#cbd5e1"><tspan x="60" dy="0">A go or no-go you can defend, criterion by criterion.</tspan></text>
<text x="60" y="172" font-size="12" fill="#94a3b8" font-weight="700" letter-spacing="1.5"><tspan x="60" dy="0">YOU BRING</tspan></text><text x="600" y="172" font-size="12" fill="#94a3b8" font-weight="700" text-anchor="middle" letter-spacing="1.5"><tspan x="600" dy="0">THE SKILL</tspan></text><text x="840" y="172" font-size="12" fill="#94a3b8" font-weight="700" letter-spacing="1.5"><tspan x="840" dy="0">YOU GET</tspan></text>
