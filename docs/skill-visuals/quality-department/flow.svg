<path class="dash" d="M360 254 C410 254 400 254 450 254" fill="none" stroke="#64748b" stroke-width="2"/><rect x="60" y="234" width="300" height="40" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><text x="76" y="259" font-size="14.5" fill="#f8fafc"><tspan x="76" dy="0">The change: branch or PR</tspan></text>
<path class="dash" d="M360 302 C410 302 400 254 450 254" fill="none" stroke="#64748b" stroke-width="2"/><rect x="60" y="282" width="300" height="40" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><text x="76" y="307" font-size="14.5" fill="#f8fafc"><tspan x="76" dy="0">Tests and repository rules</tspan></text>
<path class="dash" d="M750 254 C800 254 790 206 840 206" fill="none" stroke="#22c55e" stroke-width="2"/><rect x="840" y="186" width="300" height="40" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/><text x="856" y="211" font-size="14.5" fill="#f8fafc"><tspan x="856" dy="0">Ready / Not ready / Cannot say yet</tspan></text>
<path class="dash" d="M750 254 C800 254 790 254 840 254" fill="none" stroke="#22c55e" stroke-width="2"/><rect x="840" y="234" width="300" height="40" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/><text x="856" y="259" font-size="14.5" fill="#f8fafc"><tspan x="856" dy="0">Trace table per criterion</tspan></text>
<path class="dash" d="M750 254 C800 254 790 302 840 302" fill="none" stroke="#22c55e" stroke-width="2"/><rect x="840" y="282" width="300" height="40" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/><text x="856" y="307" font-size="14.5" fill="#f8fafc"><tspan x="856" dy="0">Next action per gap, with owner</tspan></text>
<rect x="450" y="196" width="300" height="116" rx="20" fill="#22c55e"/><text x="600" y="262" font-size="24" fill="#0f172a" font-weight="800" text-anchor="middle"><tspan x="600" dy="0">Quality Department</tspan></text>
<text x="60" y="366" font-size="12" fill="#94a3b8" font-weight="700" letter-spacing="1.5"><tspan x="60" dy="0">HOW IT ACTS</tspan></text>
<rect x="60" y="380" width="203.2" height="140" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><circle cx="84" cy="404" r="12" fill="#22c55e"/><text x="84" y="409" font-size="13" fill="#0f172a" font-weight="800" text-anchor="middle"><tspan x="84" dy="0">1</tspan></text><text x="104" y="409" font-size="14.5" fill="#f8fafc" font-weight="700"><tspan x="104" dy="0">Find what &quot;done&quot;</tspan><tspan x="104" dy="19">means</tspan></text><text x="74" y="452" font-size="12.5" fill="#cbd5e1"><tspan x="74" dy="0">Read the requirements.</tspan><tspan x="74" dy="17">Number the criteria.</tspan></text><rect x="60" y="380" width="203.2" height="140" rx="12" fill="none" stroke="#86efac" stroke-width="1.5" class="hl" style="stroke-width:3;animation-delay:0.0s"/>
<path d="M266.2 450h10" fill="none" stroke="#64748b" stroke-width="2"/><path d="M161.6 520v20" fill="none" stroke="#fbbf24" stroke-width="2"/><rect x="60" y="540" width="203.2" height="58" rx="10" fill="#451a03" stroke="#fbbf24" stroke-width="1.5"/><text x="72" y="560" font-size="12" fill="#fde68a" font-weight="600"><tspan x="72" dy="0">No stated criteria? Cannot</tspan><tspan x="72" dy="16">say yet. Ask.</tspan></text>
<rect x="279.2" y="380" width="203.2" height="140" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><circle cx="303.2" cy="404" r="12" fill="#22c55e"/><text x="303.2" y="409" font-size="13" fill="#0f172a" font-weight="800" text-anchor="middle"><tspan x="303.2" dy="0">2</tspan></text><text x="323.2" y="409" font-size="14.5" fill="#f8fafc" font-weight="700"><tspan x="323.2" dy="0">Find the evidence</tspan></text><text x="293.2" y="452" font-size="12.5" fill="#cbd5e1"><tspan x="293.2" dy="0">The test or check behind</tspan><tspan x="293.2" dy="17">each criterion.</tspan></text><rect x="279.2" y="380" width="203.2" height="140" rx="12" fill="none" stroke="#86efac" stroke-width="1.5" class="hl" style="stroke-width:3;animation-delay:1.6s"/>
<path d="M485.4 450h10" fill="none" stroke="#64748b" stroke-width="2"/><rect x="498.4" y="380" width="203.2" height="140" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><circle cx="522.4" cy="404" r="12" fill="#22c55e"/><text x="522.4" y="409" font-size="13" fill="#0f172a" font-weight="800" text-anchor="middle"><tspan x="522.4" dy="0">3</tspan></text><text x="542.4" y="409" font-size="14.5" fill="#f8fafc" font-weight="700"><tspan x="542.4" dy="0">Read the assertion</tspan></text><text x="512.4" y="452" font-size="12.5" fill="#cbd5e1"><tspan x="512.4" dy="0">Would it fail if the</tspan><tspan x="512.4" dy="17">criterion broke?</tspan></text><rect x="498.4" y="380" width="203.2" height="140" rx="12" fill="none" stroke="#86efac" stroke-width="1.5" class="hl" style="stroke-width:3;animation-delay:3.2s"/>
<path d="M704.5999999999999 450h10" fill="none" stroke="#64748b" stroke-width="2"/><path d="M600 520v20" fill="none" stroke="#fbbf24" stroke-width="2"/><rect x="498.4" y="540" width="203.2" height="58" rx="10" fill="#451a03" stroke="#fbbf24" stroke-width="1.5"/><text x="510.4" y="560" font-size="12" fill="#fde68a" font-weight="600"><tspan x="510.4" dy="0">Green but proves nothing?</tspan><tspan x="510.4" dy="16">Report a test gap.</tspan></text>
<rect x="717.5999999999999" y="380" width="203.2" height="140" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><circle cx="741.5999999999999" cy="404" r="12" fill="#22c55e"/><text x="741.5999999999999" y="409" font-size="13" fill="#0f172a" font-weight="800" text-anchor="middle"><tspan x="741.5999999999999" dy="0">4</tspan></text><text x="761.5999999999999" y="409" font-size="14.5" fill="#f8fafc" font-weight="700"><tspan x="761.5999999999999" dy="0">Run it yourself</tspan></text><text x="731.5999999999999" y="452" font-size="12.5" fill="#cbd5e1"><tspan x="731.5999999999999" dy="0">The suite, plus the spec</tspan><tspan x="731.5999999999999" dy="17">example by hand.</tspan></text><rect x="717.5999999999999" y="380" width="203.2" height="140" rx="12" fill="none" stroke="#86efac" stroke-width="1.5" class="hl" style="stroke-width:3;animation-delay:4.8s"/>
<path d="M923.8 450h10" fill="none" stroke="#64748b" stroke-width="2"/><rect x="936.8" y="380" width="203.2" height="140" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><circle cx="960.8" cy="404" r="12" fill="#22c55e"/><text x="960.8" y="409" font-size="13" fill="#0f172a" font-weight="800" text-anchor="middle"><tspan x="960.8" dy="0">5</tspan></text><text x="980.8" y="409" font-size="14.5" fill="#f8fafc" font-weight="700"><tspan x="980.8" dy="0">Answer</tspan></text><text x="950.8" y="452" font-size="12.5" fill="#cbd5e1"><tspan x="950.8" dy="0">Decision first, then gaps</tspan><tspan x="950.8" dy="17">and owners.</tspan></text><rect x="936.8" y="380" width="203.2" height="140" rx="12" fill="none" stroke="#86efac" stroke-width="1.5" class="hl" style="stroke-width:3;animation-delay:6.4s"/>
<path d="M1038.3999999999999 520v20" fill="none" stroke="#22c55e" stroke-width="2"/><rect x="936.8" y="540" width="203.2" height="58" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/><text x="948.8" y="560" font-size="12" fill="#bbf7d0" font-weight="600"><tspan x="948.8" dy="0">Ready is a recommendation.</tspan><tspan x="948.8" dy="16">Deploying is your call.</tspan></text>
<text x="60" y="644" font-size="12" fill="#94a3b8" font-weight="700" letter-spacing="1.5"><tspan x="60" dy="0">RESULT STATES</tspan></text><rect x="60" y="658" width="69" height="30" rx="15" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/><text x="94.5" y="678" font-size="13" fill="#bbf7d0" font-weight="700" text-anchor="middle"><tspan x="94.5" dy="0">Ready</tspan></text><rect x="139" y="658" width="102" height="30" rx="15" fill="#451a03" stroke="#fbbf24" stroke-width="1.5"/><text x="190" y="678" font-size="13" fill="#fde68a" font-weight="700" text-anchor="middle"><tspan x="190" dy="0">Not ready</tspan></text><rect x="251" y="658" width="143" height="30" rx="15" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/><text x="322.5" y="678" font-size="13" fill="#cbd5e1" font-weight="700" text-anchor="middle"><tspan x="322.5" dy="0">Cannot say yet</tspan></text><text x="1140" y="678" font-size="12.5" fill="#94a3b8" text-anchor="end"><tspan x="1140" dy="0">Amber: the skill stops or flags. Green: the result you want.</tspan></text>
</svg>
