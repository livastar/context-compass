<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Quality Department: the result you should get</title>
<desc id="d">The result contains: Decision (Ready, Not ready, or Cannot say yet); Trace table (Criterion, evidence, what it proves, status); Broken or unproven criteria (Observed against expected); Weak tests (Passing tests that prove nothing, apart from bugs); Next actions (Who does what for each open item); Evidence scope (Local, staging, production kept apart). It does not: Does not deploy; Does not invent requirements; Not for fixing one test or reviewing code style; Nothing is production-verified unless observed there.</desc>
<style>@media (prefers-reduced-motion: reduce){*{animation:none !important}}</style>
<rect x="1" y="1" width="1198" height="626" rx="28" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
