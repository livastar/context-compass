<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Campaign Export Handoff: the result you should get</title>
<desc id="d">The result contains: Decision (READY, FIX or HOLD); Schedule list (Cleared placements, with digest and revision); Fix queue (File, failed rule, observed, target, next action); Hold list (Replacements that need fresh measurement); Reconciliation (Omitted or extra placements, for the producer); Receipt (Kept beside the reviewed version). It does not: The producer owns the publish decision; Old measurements never clear a new file; An unavailable proof stays open; Sample files and approval are fictional.</desc>
<style>@media (prefers-reduced-motion: reduce){*{animation:none !important}}</style>
