<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">UI Recheck: one sample run</title>
<desc id="d">Sample run from the bundled synthetic example. Two states agreed: ordinary and long content. Before and after snapshots mount the same component. node server.mjs prints a local URL. 320 px and 768 px: four matched pairs, eight observations. Each pair inspected side by side. JSON and HTML exported. Outcome: 4 matched pairs · 8 observations reported.</desc>
