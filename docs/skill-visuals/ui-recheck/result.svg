<title id="t">UI Recheck: the result you should get</title>
<desc id="d">The result contains: Matched pairs (Scenario and width, before and after); Observations (Text and state, overflow, click callback, focus target); Status per check (Passed, failed, unsupported, unfinished); Exports (JSON and HTML); Session receipt (Exact restart command for an interrupted run). It does not: No screenshots or pixel comparison; Not an accessibility or release sign-off; Does not edit or deploy product code; Not a full browser regression suite.</desc>
