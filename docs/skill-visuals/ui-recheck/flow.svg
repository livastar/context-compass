<title id="t">UI Recheck: what it does and how it acts</title>
<desc id="d">Inputs: Before snapshot of the component; After snapshot; Agreed states, widths, assertions. Steps: Agree the cases, Prepare both sides, Start the workbench, Run observations, Inspect the pairs, Export. Outputs: Matched before/after results; JSON and HTML export; Session receipt to resume.</desc>
