<title id="t">Context Compass: one sample run</title>
<desc id="d">Sample run from a local, internal example in this repository. Request: show API and schema contract files in the repo map. Scanner lists contracts/openapi.yaml as a lead, not proof. Trace: three criteria tied to code and fixture tests. New tests fail first: the contracts field is missing. npm run check passes: typecheck, lint, build, tests. Brief returned. One unknown kept: which contract governs a code path. Outcome: 3 criteria Verified · 1 Unknown kept.</desc>
