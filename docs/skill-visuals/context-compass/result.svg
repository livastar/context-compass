<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Context Compass: the result you should get</title>
<desc id="d">The result contains: Intent and scope (Desired outcome, constraints, non-goals); Evidence and open decisions (Verified, Inferred leads, Unknown); Acceptance and traceability (Criterion, contract, code, proof, status); Change summary (Files changed and why, or proposed files); Verification (Exact commands and what really ran); Risks and follow-up (Remaining unknowns and the smallest next step). It does not: Returns text, not a PDF or file; No correctness guarantee; No whole-repo &quot;ready&quot; verdict; Read-only unless you ask for the change.</desc>
<style>@media (prefers-reduced-motion: reduce){*{animation:none !important}}</style>
